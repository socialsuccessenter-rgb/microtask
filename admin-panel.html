<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>মাস্টার অ্যাডমিন কন্ট্রোল - প্রো ম্যাক্স</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #219150; }
        .section-title { background: #e8f4fd; padding: 10px; border-radius: 5px; margin-top: 20px; color: #2980b9; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🛠️ অ্যাপের অল-ইন-ওয়ান কন্ট্রোল</h2>
        
        <div class="section-title">💰 রেট এবং লিমিট সেটিংস</div>
        <div class="grid">
            <div><label>অ্যাড রেট (৳)</label><input type="number" id="ad_rate" step="0.1"></div>
            <div><label>রেফার রেট (৳)</label><input type="number" id="ref_rate" step="0.1"></div>
            <div><label>অ্যাড লিমিট (Daily)</label><input type="number" id="ad_limit"></div>
            <div><label>মিনিমাম উইথড্র (৳)</label><input type="number" id="min_withdraw"></div>
        </div>

        <div class="section-title">🔗 সোশ্যাল টাস্ক ও লিঙ্ক</div>
        <div class="grid">
            <div><label>FB ফলো রিওয়ার্ড (৳)</label><input type="number" id="fb_reward"></div>
            <div><label>TG জয়েন রিওয়ার্ড (৳)</label><input type="number" id="tg_reward"></div>
            <div class="full"><label>Facebook লিঙ্ক</label><input type="text" id="fb_link"></div>
            <div class="full"><label>Telegram লিঙ্ক</label><input type="text" id="tg_link"></div>
        </div>

        <div class="section-title">📢 নোটিশ বোর্ড কন্ট্রোল</div>
        <label>হোম পেজ নোটিশ (Rain Card এর নিচে)</label>
        <input type="text" id="home_notice">
        
        <label>রেফার পেজ নোটিশ</label>
        <input type="text" id="ref_notice">
        
        <label>উইথড্র পেজ মেইন নোটিশ</label>
        <input type="text" id="withdraw_notice">

        <button onclick="saveSettings()">সব কিছু আপডেট করুন 🚀</button>
    </div>
</div>

<script>
    const dbURL = "https://earnmoneybot-8836f-default-rtdb.firebaseio.com/settings.json";

    async function loadSettings() {
        const res = await fetch(dbURL);
        const data = await res.json();
        if(data) {
            document.getElementById('ad_rate').value = data.ad_rate || 2;
            document.getElementById('ref_rate').value = data.ref_rate || 13;
            document.getElementById('ad_limit').value = data.ad_limit || 5;
            document.getElementById('min_withdraw').value = data.min_withdraw || 1300;
            document.getElementById('fb_reward').value = data.fb_reward || 5;
            document.getElementById('tg_reward').value = data.tg_reward || 3;
            document.getElementById('fb_link').value = data.fb_link || "";
            document.getElementById('tg_link').value = data.tg_link || "";
            document.getElementById('home_notice').value = data.home_notice || "";
            document.getElementById('ref_notice').value = data.ref_notice || "";
            document.getElementById('withdraw_notice').value = data.withdraw_notice || "";
        }
    }

    async function saveSettings() {
        const settings = {
            ad_rate: parseFloat(document.getElementById('ad_rate').value),
            ref_rate: parseFloat(document.getElementById('ref_rate').value),
            ad_limit: parseInt(document.getElementById('ad_limit').value),
            min_withdraw: parseInt(document.getElementById('min_withdraw').value),
            fb_reward: parseInt(document.getElementById('fb_reward').value),
            tg_reward: parseInt(document.getElementById('tg_reward').value),
            fb_link: document.getElementById('fb_link').value,
            tg_link: document.getElementById('tg_link').value,
            home_notice: document.getElementById('home_notice').value,
            ref_notice: document.getElementById('ref_notice').value,
            withdraw_notice: document.getElementById('withdraw_notice').value
        };
        await fetch(dbURL, { method: 'PUT', body: JSON.stringify(settings) });
        alert("সব সেটিংস সফলভাবে সেভ হয়েছে ভাই!");
    }
    loadSettings();
</script>
</body>
</html>
