<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাস্টার অ্যাডমিন কন্ট্রোল - প্রো ম্যাক্স</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: auto; }
        
        #login_screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }

        #admin_content { display: none; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 5px solid var(--accent); }
        h2 { color: var(--primary); margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .full { grid-column: span 2; }
        label { font-weight: bold; font-size: 13px; color: #555; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }

        .table-wrapper { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: var(--primary); color: white; }

        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-update { background: var(--success); color: white; width: 100%; margin-top: 20px; font-size: 16px; }
        .btn-refresh { background: var(--accent); color: white; margin-bottom: 10px; }
        .btn-save-user { background: #e67e22; color: white; padding: 6px 12px; font-size: 12px; }
        
        .section-title { background: #eef2f7; padding: 10px; border-radius: 6px; margin: 20px 0 10px; color: #34495e; font-weight: bold; font-size: 15px; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

<div id="login_screen">
    <div class="login-card">
        <h2 style="justify-content: center;">🔒 অ্যাডমিন লগইন</h2>
        <input type="password" id="admin_pass" placeholder="পাসওয়ার্ড দিন">
        <button class="btn-update" onclick="checkLogin()">প্রবেশ করুন</button>
    </div>
</div>

<div id="admin_content" class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>🛠️ অ্যাপ ইন্টারফেস সেটিংস</h2>
            <button onclick="logout()" style="background: #e74c3c; color: white; padding: 5px 15px;">লগআউট</button>
        </div>
        
        <div class="section-title">💰 রেট, লিমিট এবং লিঙ্ক</div>
        <div class="grid">
            <div><label>অ্যাড রেট (৳)</label><input type="number" id="ad_rate" step="0.1"></div>
            <div><label>রেফার রেট (৳)</label><input type="number" id="ref_rate" step="0.1"></div>
            <div><label>ডেইলি অ্যাড লিমিট</label><input type="number" id="ad_limit"></div>
            <div><label>মিনিমাম উইথড্র (৳)</label><input type="number" id="min_withdraw"></div>
            <div><label>FB রিওয়ার্ড (৳)</label><input type="number" id="fb_reward"></div>
            <div><label>TG রিওয়ার্ড (৳)</label><input type="number" id="tg_reward"></div>
            <div class="full"><label>Facebook লিঙ্ক</label><input type="text" id="fb_link"></div>
            <div class="full"><label>Telegram লিঙ্ক</label><input type="text" id="tg_link"></div>
        </div>

        <div class="section-title">📢 নোটিশ বোর্ড</div>
        <label>হোম পেজ নোটিশ</label><input type="text" id="home_notice">
        <label>রেফার পেজ নোটিশ</label><input type="text" id="ref_notice">
        <label>উইথড্র পেজ নোটিশ</label><input type="text" id="withdraw_notice">

        <button class="btn-update" onclick="saveSettings()">সব সেটিংস সেভ করুন 🚀</button>
    </div>

    <div class="card">
        <h2>👥 ইউজার ডাটাবেস ম্যানেজমেন্ট</h2>
        <button class="btn-refresh" onclick="loadUsers()">🔄 রিফ্রেশ লিস্ট</button>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ইউজার ID</th>
                        <th>ব্যালেন্স (৳)</th>
                        <th>রেফার</th>
                        <th>টাস্ক (FB/TG)</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="user_list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const dbURL = "https://earnmoneybot-8836f-default-rtdb.firebaseio.com";
    
    function checkLogin() {
        const pass = document.getElementById('admin_pass').value;
        if(pass === "252646") { 
            document.getElementById('login_screen').style.display = 'none';
            document.getElementById('admin_content').style.display = 'block';
            loadSettings();
            loadUsers();
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function logout() { location.reload(); }

    async function loadSettings() {
        try {
            const res = await fetch(`${dbURL}/settings.json`);
            const data = await res.json();
            if(data) {
                document.getElementById('ad_rate').value = data.ad_rate || 2;
                document.getElementById('ref_rate').value = data.ref_rate || 13;
                document.getElementById('ad_limit').value = data.ad_limit || 5;
                document.getElementById('min_withdraw').value = data.min_withdraw || 1300;
                document.getElementById('fb_reward').value = data.fb_reward || 5;
                document.getElementById('tg_reward').value = data.tg_reward || 3;
                document.getElementById('fb_link').value = data.fb_link || "";
                document.getElementById('tg_link').value = data.tg_link || "";
                document.getElementById('home_notice').value = data.home_notice || "";
                document.getElementById('ref_notice').value = data.ref_notice || "";
                document.getElementById('withdraw_notice').value = data.withdraw_notice || "";
            }
        } catch(e) { console.error("Settings load error"); }
    }

    async function saveSettings() {
        const settings = {
            ad_rate: parseFloat(document.getElementById('ad_rate').value),
            ref_rate: parseFloat(document.getElementById('ref_rate').value),
            ad_limit: parseInt(document.getElementById('ad_limit').value),
            min_withdraw: parseInt(document.getElementById('min_withdraw').value),
            fb_reward: parseInt(document.getElementById('fb_reward').value),
            tg_reward: parseInt(document.getElementById('tg_reward').value),
            fb_link: document.getElementById('fb_link').value,
            tg_link: document.getElementById('tg_link').value,
            home_notice: document.getElementById('home_notice').value,
            ref_notice: document.getElementById('ref_notice').value,
            withdraw_notice: document.getElementById('withdraw_notice').value
        };
        try {
            await fetch(`${dbURL}/settings.json`, { method: 'PUT', body: JSON.stringify(settings) });
            alert("সব সেটিংস সফলভাবে আপডেট হয়েছে!");
        } catch(e) { alert("সেভ করতে সমস্যা হয়েছে!"); }
    }

    async function loadUsers() {
        const tbody = document.getElementById('user_list');
        tbody.innerHTML = "<tr><td colspan='5'>লোড হচ্ছে...</td></tr>";
        try {
            const res = await fetch(`${dbURL}/users.json`);
            const users = await res.json();
            tbody.innerHTML = "";
            for (let id in users) {
                const user = users[id];
                tbody.innerHTML += `
                    <tr>
                        <td>${id}</td>
                        <td><input type="number" id="bal_${id}" value="${user.balance}" style="width:70px; border:1px solid #ddd; padding:5px; border-radius:4px;"></td>
                        <td>${user.refs || 0}</td>
                        <td>FB: ${user.tasks?.fb?'✅':'❌'} | TG: ${user.tasks?.tg?'✅':'❌'}</td>
                        <td><button class="btn-save-user" onclick="updateUser('${id}')">Save</button></td>
                    </tr>
                `;
            }
        } catch (e) { tbody.innerHTML = "<tr><td colspan='5'>কোনো ইউজার ডাটা পাওয়া যায়নি।</td></tr>"; }
    }

    async function updateUser(uid) {
        const newBal = parseFloat(document.getElementById(`bal_${uid}`).value);
        try {
            await fetch(`${dbURL}/users/${uid}.json`, { 
                method: 'PATCH', 
                body: JSON.stringify({ balance: newBal }) 
            });
            alert("ইউজার আইডি " + uid + " এর ব্যালেন্স আপডেট হয়েছে!");
        } catch(e) { alert("আপডেট ব্যর্থ হয়েছে!"); }
    }
</script>
</body>
</html>
