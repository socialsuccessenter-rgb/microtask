<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microtask - Master Admin</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        #login_box { max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px; }
        .login-btn { background: var(--accent); color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }

        #admin_content { display: none; max-width: 1000px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0ea5e9, #2563eb); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: var(--card); padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #334155; }
        .stat-box h3 { margin: 0; font-size: 35px; color: var(--accent); }
        .user-table-container { background: var(--card); border-radius: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: var(--accent); }
        .balance-tag { background: #065f46; color: #34d399; padding: 4px 8px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login_box">
        <h2>🔒 অ্যাডমিন লগইন</h2>
        <p style="opacity: 0.7; font-size: 14px; margin-bottom: 20px;">পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
        <input type="password" id="admin_pass" placeholder="Password Here">
        <button class="login-btn" onclick="checkLogin()">Login</button>
        <p id="error_msg" style="color: #e74c3c; margin-top: 10px; display: none;">ভুল পাসওয়ার্ড!</p>
    </div>

    <div id="admin_content">
        <div class="header">
            <h1>🚀 মাইক্রোটাস্ক মাস্টার কন্ট্রোল</h1>
            <p>রিয়েল-টাইম ইউজার ম্যানেজমেন্ট</p>
            <button onclick="loadAdminData()" style="margin-top:10px; padding:8px 15px; border-radius:8px; border:none; background:white; color:#0ea5e9; font-weight:bold; cursor:pointer;">🔄 রিফ্রেশ লিস্ট</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3 id="u_count">0</h3>
                <p>মোট ইউজার</p>
            </div>
            <div class="stat-box">
                <h3 id="t_balance">0.00</h3>
                <p>ইউজারদের মোট ব্যালেন্স (৳)</p>
            </div>
        </div>

        <div class="user-table-container">
            <table>
                <thead>
                    <tr>
                        <th>ইউজার আইডি</th>
                        <th>ব্যালেন্স (৳)</th>
                        <th>রেফার</th>
                    </tr>
                </thead>
                <tbody id="user_rows">
                    <tr><td colspan="3" style="text-align:center;">ডাটা লোড হচ্ছে...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const dbPath = "https://earnmoneybot-8836f-default-rtdb.firebaseio.com/users.json";
        const correctPass = "252646"; // আপনার দেওয়া পাসওয়ার্ড সেট করা হয়েছে

        function checkLogin() {
            const inputPass = document.getElementById('admin_pass').value;
            if (inputPass === correctPass) {
                document.getElementById('login_box').style.display = 'none';
                document.getElementById('admin_content').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('error_msg').style.display = 'block';
                setTimeout(() => { document.getElementById('error_msg').style.display = 'none'; }, 2000);
            }
        }

        async function loadAdminData() {
            const rows = document.getElementById('user_rows');
            try {
                const response = await fetch(dbPath);
                const allUsers = await response.json();
                
                if (allUsers) {
                    let userIds = Object.keys(allUsers);
                    let totalBalance = 0;
                    let rowsHTML = "";

                    userIds.forEach(id => {
                        const user = allUsers[id];
                        const bal = parseFloat(user.balance || 0);
                        const refs = user.refs || 0;
                        totalBalance += bal;
                        rowsHTML += `<tr>
                            <td>${id}</td>
                            <td><span class="balance-tag">${bal.toFixed(2)} ৳</span></td>
                            <td>${refs} জন</td>
                        </tr>`;
                    });

                    document.getElementById('u_count').innerText = userIds.length;
                    document.getElementById('t_balance').innerText = totalBalance.toFixed(2);
                    rows.innerHTML = rowsHTML;
                } else {
                    rows.innerHTML = '<tr><td colspan="3" style="text-align:center;">কোনো ইউজার ডাটা পাওয়া যায়নি।</td></tr>';
                }
            } catch (error) {
                rows.innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">ডাটাবেস কানেকশন এরর! নিশ্চিত করুন Firebase Rules "Open" আছে।</td></tr>';
            }
        }
    </script>
</body>
</html>
