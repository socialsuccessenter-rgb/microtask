<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microtask - প্রো অ্যাডমিন প্যানেল</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Header Style */
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        
        /* Card Style */
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Input & Button Style */
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        .btn-refresh { background: var(--accent); color: white; margin-bottom: 10px; }
        
        /* Settings Grid */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        
        /* Table Style */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; font-size: 14px; }
        th { background: #f8f9fa; color: var(--primary); }
        tr:hover { background: #f9f9f9; }
        
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; color: white; }
        .bg-fb { background: #1877F2; }
        .bg-tg { background: #0088cc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 মাইক্রোটাস্ক মাস্টার কন্ট্রোল</h1>
        <p>ব্যার্থ প্রেমি ভাই, এখান থেকে সবকিছু সামলান!</p>
    </div>

    <div class="card">
        <h3>⚙️ অ্যাপের টেক্সট ও রেট সেটিংস</h3>
        <div class="settings-grid">
            <div><label>অ্যাড রেট (৳)</label><input type="number" id="set_ad_rate" step="0.1"></div>
            <div><label>রেফার রেট (৳)</label><input type="number" id="set_ref_rate" step="0.1"></div>
            <div><label>মিনিমাম উইথড্র (৳)</label><input type="number" id="set_min_withdraw"></div>
            <div style="grid-column: span 2;">
                <label>হোম পেজ নোটিশ</label>
                <input type="text" id="set_home_notice">
            </div>
            <div style="grid-column: span 2;">
                <label>উইথড্র পেজ নোটিশ</label>
                <input type="text" id="set_withdraw_notice">
            </div>
        </div>
        <button class="btn-save" onclick="saveGlobalSettings()">সব আপডেট করুন</button>
    </div>

    <div class="card">
        <h3>👥 ইউজার লিস্ট ও ব্যালেন্স কন্ট্রোল</h3>
        <button class="btn-refresh" onclick="loadUsers()">ইউজার লিস্ট রিফ্রেশ করুন</button>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ইউজার ID</th>
                        <th>ব্যালেন্স (৳)</th>
                        <th>রেফার</th>
                        <th>টাস্ক (FB/TG)</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="user_list">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const dbBase = "https://earnmoneybot-8836f-default-rtdb.firebaseio.com";

    // --- ১. সেটিংস ফাংশন ---
    async function loadGlobalSettings() {
        const res = await fetch(`${dbBase}/settings.json`);
        const data = await res.json();
        if(data) {
            document.getElementById('set_ad_rate').value = data.ad_rate || 2;
            document.getElementById('set_ref_rate').value = data.ref_rate || 13;
            document.getElementById('set_min_withdraw').value = data.min_withdraw || 1300;
            document.getElementById('set_home_notice').value = data.home_notice || "🌧️ ছোট ছোট কাজ করে টাকা ইনকাম করুন 🌧️";
            document.getElementById('set_withdraw_notice').value = data.withdraw_notice || "সঠিক তথ্য দিলে ২৪ ঘন্টার মধ্যে পেমেন্ট পাবেন";
        }
    }

    async function saveGlobalSettings() {
        const settings = {
            ad_rate: parseFloat(document.getElementById('set_ad_rate').value),
            ref_rate: parseFloat(document.getElementById('set_ref_rate').value),
            min_withdraw: parseInt(document.getElementById('set_min_withdraw').value),
            home_notice: document.getElementById('set_home_notice').value,
            withdraw_notice: document.getElementById('set_withdraw_notice').value,
            ad_limit: 5
        };
        await fetch(`${dbBase}/settings.json`, { method: 'PUT', body: JSON.stringify(settings) });
        alert("অ্যাপ সেটিংস সফলভাবে সেভ হয়েছে!");
    }

    // --- ২. ইউজার ম্যানেজমেন্ট ফাংশন ---
    async function loadUsers() {
        const tbody = document.getElementById('user_list');
        tbody.innerHTML = "<tr><td colspan='5'>লোড হচ্ছে...</td></tr>";
        
        try {
            const res = await fetch(`${dbBase}/users.json`);
            const users = await res.json();
            tbody.innerHTML = "";

            for (let id in users) {
                const user = users[id];
                const fbTask = user.tasks?.fb ? '<span class="badge bg-fb">Done</span>' : '❌';
                const tgTask = user.tasks?.tg ? '<span class="badge bg-tg">Done</span>' : '❌';

                tbody.innerHTML += `
                    <tr>
                        <td>${id}</td>
                        <td><input type="number" value="${user.balance}" id="bal_${id}" style="width:80px"></td>
                        <td>${user.refs || 0}</td>
                        <td>FB: ${fbTask} | TG: ${tgTask}</td>
                        <td><button onclick="updateUser('${id}')" style="background:#27ae60; color:white; padding:5px 10px;">সেভ</button></td>
                    </tr>
                `;
            }
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='5'>কোনো ইউজার পাওয়া যায়নি।</td></tr>";
        }
    }

    async function updateUser(uid) {
        const newBal = parseFloat(document.getElementById(`bal_${uid}`).value);
        await fetch(`${dbBase}/users/${uid}.json`, { 
            method: 'PATCH', 
            body: JSON.stringify({ balance: newBal }) 
        });
        alert("ইউজার ব্যালেন্স আপডেট হয়েছে!");
    }

    // শুরুতে লোড করা
    loadGlobalSettings();
    loadUsers();
</script>

</body>
</html>
